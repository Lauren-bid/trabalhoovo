<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4FF"/>
      <stop offset="100%" stop-color="#00E5A0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Axes -->
  <line x1="50" y1="250" x2="350" y2="250" stroke="#C5D0DC" stroke-width="2"/>
  <line x1="50" y1="250" x2="50" y2="50" stroke="#C5D0DC" stroke-width="2"/>
  <!-- X axis label -->
  <text x="200" y="285" text-anchor="middle" font-family="Inter" font-size="14" fill="#C5D0DC">Wavelength (nm)</text>
  <!-- Y axis label -->
  <text x="20" y="150" text-anchor="middle" font-family="Inter" font-size="14" fill="#C5D0DC" transform="rotate(-90 20,150)">Absorption</text>
  <!-- Data curve -->
  <path d="M50 200 C100 180 150 110 200 100 C250 90 300 150 350 120" fill="none" stroke="url(#grad)" stroke-width="3" filter="url(#glow)"/>
  <!-- Highlights -->
  <circle cx="200" cy="100" r="4" fill="#00E5A0"/>
  <text x="210" y="95" font-family="Inter" font-size="12" fill="#C5D0DC">Peak</text>
</svg>
