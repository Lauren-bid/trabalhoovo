<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5A0"/>
      <stop offset="100%" stop-color="#30D5FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer ring -->
  <circle cx="200" cy="135" r="85" fill="none" stroke="rgba(0,229,160,0.1)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="200" cy="135" r="70" fill="none" stroke="rgba(0,229,160,0.15)" stroke-width="1"/>

  <!-- Success circle -->
  <circle cx="200" cy="135" r="55" fill="rgba(0,229,160,0.06)" stroke="url(#successGrad)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Checkmark -->
  <polyline points="175,138 192,155 228,118" fill="none" stroke="url(#successGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#bigGlow)"/>

  <!-- Data readout panels -->
  <rect x="80" y="235" width="100" height="32" rx="8" fill="rgba(0,229,160,0.08)" stroke="rgba(0,229,160,0.25)" stroke-width="0.8"/>
  <text x="130" y="248" text-anchor="middle" font-family="'Exo 2', sans-serif" font-size="7" fill="#6B7B8D" letter-spacing="0.06em">CONFIABILIDADE</text>
  <text x="130" y="261" text-anchor="middle" font-family="'Exo 2', sans-serif" font-size="11" fill="#4affc4" letter-spacing="0.04em" font-weight="700">99.8%</text>

  <rect x="220" y="235" width="100" height="32" rx="8" fill="rgba(0,180,255,0.08)" stroke="rgba(0,180,255,0.25)" stroke-width="0.8"/>
  <text x="270" y="248" text-anchor="middle" font-family="'Exo 2', sans-serif" font-size="7" fill="#6B7B8D" letter-spacing="0.06em">STATUS</text>
  <text x="270" y="261" text-anchor="middle" font-family="'Exo 2', sans-serif" font-size="11" fill="#30D5FF" letter-spacing="0.04em" font-weight="700">SEPARADO</text>

  <!-- Small decorative dots -->
  <circle cx="120" cy="82" r="2" fill="#00E5A0" opacity="0.5"/>
  <circle cx="280" cy="88" r="2" fill="#30D5FF" opacity="0.5"/>
  <circle cx="140" cy="195" r="1.5" fill="#00B4FF" opacity="0.4"/>
  <circle cx="260" cy="190" r="1.5" fill="#00E5A0" opacity="0.4"/>

  <!-- Bottom label -->
  <text x="200" y="285" text-anchor="middle" font-family="'Exo 2', sans-serif" font-size="8" fill="#6B7B8D" letter-spacing="0.06em">DIRECIONAMENTO AUTOMATIZADO</text>
</svg>
