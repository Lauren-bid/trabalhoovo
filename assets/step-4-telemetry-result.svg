<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5A0"/>
      <stop offset="100%" stop-color="#30D5FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background panel -->
  <rect x="20" y="20" width="360" height="260" fill="#081B33" rx="15" ry="15"/>
  <!-- Checkmark -->
  <polyline points="120,150 170,200 280,100" fill="none" stroke="url(#greenGrad)" stroke-width="12" filter="url(#glow)"/>
  <!-- Data readouts -->
  <text x="200" y="250" text-anchor="middle" font-family="Orbitron" font-size="24" fill="#C5D0DC">SUCCESS</text>
  <text x="200" y="220" text-anchor="middle" font-family="Inter" font-size="16" fill="#C5D0DC">Sex: Male (99.8%)</text>
</svg>
