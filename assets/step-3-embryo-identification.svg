<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B4FF"/>
      <stop offset="100%" stop-color="#30D5FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Embryo silhouette -->
  <path d="M200 80 q30 20 40 60 t0 80 q-40 30 -80 0 t0 -80 q10 -40 40 -60" fill="#081B33"/>
  <!-- Neural connections -->
  <line x1="200" y1="80" x2="130" y2="150" stroke="#00E5A0" stroke-width="2" opacity="0.7"/>
  <line x1="200" y1="80" x2="270" y2="150" stroke="#00E5A0" stroke-width="2" opacity="0.7"/>
  <line x1="130" y1="150" x2="270" y2="150" stroke="#00B4FF" stroke-width="1" opacity="0.5"/>
  <circle cx="130" cy="150" r="5" fill="#00E5A0" filter="url(#glow)"/>
  <circle cx="270" cy="150" r="5" fill="#00E5A0" filter="url(#glow)"/>
  <circle cx="200" cy="80" r="5" fill="#00B4FF" filter="url(#glow)"/>
</svg>
