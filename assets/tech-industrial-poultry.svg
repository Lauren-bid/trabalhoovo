<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4FF"/>
      <stop offset="100%" stop-color="#30D5FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Conveyor belt -->
  <rect x="30" y="220" width="340" height="30" fill="#081B33"/>
  <!-- Eggs on belt -->
  <ellipse cx="80" cy="210" rx="30" ry="40" fill="#081B33"/>
  <ellipse cx="180" cy="210" rx="30" ry="40" fill="#081B33"/>
  <ellipse cx="280" cy="210" rx="30" ry="40" fill="#081B33"/>
  <ellipse cx="380" cy="210" rx="30" ry="40" fill="#081B33"/>
  <!-- Machinery silhouette -->
  <path d="M100 150 h200 v30 h-200 z" fill="#081B33"/>
  <!-- LEDs -->
  <circle cx="120" cy="165" r="5" fill="url(#grad)" filter="url(#glow)"/>
  <circle cx="380" cy="165" r="5" fill="url(#grad)" filter="url(#glow)"/>
  <!-- Efficiency indicator -->
  <text x="200" y="100" text-anchor="middle" font-family="Orbitron" font-size="28" fill="#C5D0DC">INDÚSTRIA DE AVICULTURA</text>
</svg>
