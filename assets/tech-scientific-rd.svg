<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4FF"/>
      <stop offset="100%" stop-color="#00E5A0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Laboratory bench -->
  <rect x="20" y="150" width="360" height="100" fill="#081B33" rx="10" ry="10"/>
  <!-- Microscope -->
  <path d="M100 200 h20 v-40 h-20 z" fill="#081B33"/>
  <rect x="105" y="150" width="10" height="40" fill="url(#grad)" filter="url(#glow)"/>
  <!-- Test tubes -->
  <rect x="150" y="180" width="15" height="40" fill="#081B33"/>
  <rect x="180" y="170" width="15" height="50" fill="#081B33"/>
  <rect x="210" y="180" width="15" height="40" fill="#081B33"/>
  <!-- DNA helix -->
  <path d="M260 200 q20 -30 0 -60 q-20 30 0 60" stroke="url(#grad)" stroke-width="3" fill="none" filter="url(#glow)"/>
  <path d="M280 200 q20 -30 0 -60 q-20 30 0 60" stroke="url(#grad)" stroke-width="3" fill="none" filter="url(#glow)"/>
  <!-- Data charts -->
  <rect x="300" y="170" width="40" height="20" fill="#00E5A0"/>
  <rect x="300" y="200" width="40" height="30" fill="#00B4FF"/>
</svg>
