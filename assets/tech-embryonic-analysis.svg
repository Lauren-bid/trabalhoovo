<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 620 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradientes Principais Neon ZYVORA -->
    <linearGradient id="neonCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00B4FF"/>
      <stop offset="100%" stop-color="#00E5A0"/>
    </linearGradient>
    <linearGradient id="laserBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30D5FF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00E5A0" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="eggAuraCore" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#00B4FF" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#081B33" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#020D1C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eggBodyGrad" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#1b4d7e"/>
      <stop offset="45%" stop-color="#0d2e52"/>
      <stop offset="85%" stop-color="#06182e"/>
      <stop offset="100%" stop-color="#020c18"/>
    </radialGradient>
    <radialGradient id="embryoBiolum" cx="48%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#00F0FF" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#00B4FF" stop-opacity="0.55"/>
      <stop offset="90%" stop-color="#00E5A0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00E5A0" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtros de Glow Neon Intenso -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Aura central expansiva -->
  <circle cx="310" cy="140" r="135" fill="url(#eggAuraCore)"/>

  <!-- Malha Holográfica Circular de Medição Bio-Óptica -->
  <g opacity="0.4" stroke="#00B4FF">
    <circle cx="310" cy="140" r="118" fill="none" stroke-width="0.75" stroke-dasharray="3 5"/>
    <circle cx="310" cy="140" r="92" fill="none" stroke-width="0.9" stroke-dasharray="6 4"/>
    <circle cx="310" cy="140" r="70" fill="none" stroke-width="0.6" stroke-dasharray="2 3"/>
    
    <!-- Linhas de Coordenadas Radiais -->
    <line x1="165" y1="140" x2="455" y2="140" stroke-width="0.8" stroke-dasharray="4 6"/>
    <line x1="310" y1="15" x2="310" y2="265" stroke-width="0.8" stroke-dasharray="4 6"/>
    <line x1="205" y1="50" x2="415" y2="230" stroke-width="0.5" stroke-dasharray="2 4"/>
    <line x1="205" y1="230" x2="415" y2="50" stroke-width="0.5" stroke-dasharray="2 4"/>
  </g>

  <!-- Marcadores em Graus no Círculo Exterior -->
  <g fill="#30D5FF" font-family="'Orbitron', sans-serif" font-size="7" font-weight="700" opacity="0.6" text-anchor="middle">
    <text x="310" y="32">000° SPECTRAL</text>
    <text x="440" y="143">090°</text>
    <text x="310" y="254">180°</text>
    <text x="180" y="143">270°</text>
  </g>

  <!-- ==========================================
       OVO BIOTECNOLÓGICO ZYVORA CENTRAL
       ========================================== -->
  <!-- Base de Levitação Eletromagnética -->
  <ellipse cx="310" cy="226" rx="68" ry="14" fill="#00B4FF" opacity="0.2" filter="url(#superGlow)"/>
  <ellipse cx="310" cy="226" rx="42" ry="7" fill="#00F0FF" opacity="0.6" filter="url(#softGlow)"/>

  <!-- Casca do Ovo Translúcida -->
  <path d="M 310 46 C 354 46 380 114 380 174 C 380 212 348 230 310 230 C 272 230 240 212 240 174 C 240 114 266 46 310 46 Z" 
        fill="url(#eggBodyGrad)" stroke="url(#neonCyanBlue)" stroke-width="2.4" filter="url(#superGlow)"/>

  <!-- Brilho de Borda da Casca (Reflexo Especular Orgânico) -->
  <path d="M 288 60 C 272 78 256 116 256 156 C 256 160 250 160 250 154 C 251 110 268 70 284 54 C 287 51 291 55 288 60 Z" 
        fill="#FFFFFF" opacity="0.6" filter="url(#softGlow)"/>

  <!-- Espiral de Energia Orbital Estilo ZYVORA envolvendo o ovo -->
  <path d="M 230 185 C 220 145 250 100 310 90 C 370 80 400 120 390 165 C 385 185 355 210 305 215 C 265 220 235 205 230 185" 
        fill="none" stroke="url(#neonCyanBlue)" stroke-width="3" stroke-linecap="round" opacity="0.9" filter="url(#superGlow)"/>
  <path d="M 232 183 C 224 147 252 104 310 92 C 368 82 396 122 388 163" 
        fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

  <!-- Embrião Iluminado no Interior (Bioluminescência Celular) -->
  <ellipse cx="310" cy="155" rx="38" ry="46" fill="url(#embryoBiolum)" filter="url(#superGlow)"/>
  
  <!-- Rede Vascular Embrionária D-04 -->
  <g stroke="#00F0FF" stroke-width="1.5" fill="none" opacity="0.85" filter="url(#softGlow)">
    <path d="M 310 150 Q 300 138 294 126 T 286 116"/>
    <path d="M 310 150 Q 320 138 328 125 T 334 114"/>
    <path d="M 310 158 Q 298 170 292 182 T 285 192"/>
    <path d="M 310 158 Q 322 172 328 184 T 336 194"/>
    <circle cx="310" cy="154" r="6" fill="#FFFFFF" filter="url(#superGlow)"/>
  </g>

  <!-- ==========================================
       PAINEL ESQUERDO: EMISSOR MULTI-LASER (OPTIC-TX)
       ========================================== -->
  <g transform="translate(42, 62)">
    <!-- Chassis do Sensor Industrial -->
    <rect x="0" y="0" width="138" height="152" rx="10" fill="#081B33" stroke="rgba(0,180,255,0.4)" stroke-width="1.5"/>
    <rect x="8" y="8" width="122" height="136" rx="6" fill="#040e1e" opacity="0.85"/>

    <!-- Cabeçalho do HUD -->
    <rect x="14" y="16" width="110" height="20" rx="4" fill="rgba(0,180,255,0.15)"/>
    <circle cx="24" cy="26" r="3.5" fill="#00F0FF" filter="url(#softGlow)"/>
    <text x="68" y="29" fill="#30D5FF" font-family="'Orbitron', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="1">MULTI-λ EMITTER</text>

    <!-- Linhas de Emissão Óptica e Comprimentos de Onda -->
    <!-- Canal 1 (450nm - Azul Profundo) -->
    <g transform="translate(14, 46)">
      <rect x="0" y="0" width="110" height="24" rx="4" fill="rgba(0,180,255,0.08)" stroke="rgba(0,180,255,0.25)" stroke-width="0.8"/>
      <circle cx="12" cy="12" r="4" fill="#00B4FF" filter="url(#softGlow)"/>
      <text x="44" y="15" fill="#C5D0DC" font-family="'Orbitron', sans-serif" font-size="8" font-weight="600">450 nm</text>
      <text x="96" y="15" fill="#30D5FF" font-family="'Orbitron', sans-serif" font-size="8" font-weight="700">UV-A</text>
    </g>

    <!-- Canal 2 (680nm - Vermelho/Espectral) -->
    <g transform="translate(14, 76)">
      <rect x="0" y="0" width="110" height="24" rx="4" fill="rgba(0,229,160,0.08)" stroke="rgba(0,229,160,0.25)" stroke-width="0.8"/>
      <circle cx="12" cy="12" r="4" fill="#00E5A0" filter="url(#softGlow)"/>
      <text x="44" y="15" fill="#C5D0DC" font-family="'Orbitron', sans-serif" font-size="8" font-weight="600">680 nm</text>
      <text x="96" y="15" fill="#00E5A0" font-family="'Orbitron', sans-serif" font-size="8" font-weight="700">HEMO</text>
    </g>

    <!-- Canal 3 (850nm - Infravermelho Próximo) -->
    <g transform="translate(14, 106)">
      <rect x="0" y="0" width="110" height="24" rx="4" fill="rgba(0,240,255,0.08)" stroke="rgba(0,240,255,0.25)" stroke-width="0.8"/>
      <circle cx="12" cy="12" r="4" fill="#00F0FF" filter="url(#softGlow)"/>
      <text x="44" y="15" fill="#C5D0DC" font-family="'Orbitron', sans-serif" font-size="8" font-weight="600">850 nm</text>
      <text x="96" y="15" fill="#00F0FF" font-family="'Orbitron', sans-serif" font-size="8" font-weight="700">NIR</text>
    </g>

    <!-- Feixes Laser Focados Atravessando em Direção ao Ovo -->
    <path d="M 138 58 L 240 120" stroke="#00B4FF" stroke-width="2.2" stroke-dasharray="5 3" opacity="0.9" filter="url(#softGlow)"/>
    <path d="M 138 88 L 240 155" stroke="#00E5A0" stroke-width="2.8" opacity="0.95" filter="url(#superGlow)"/>
    <path d="M 138 118 L 240 190" stroke="#00F0FF" stroke-width="2.2" stroke-dasharray="5 3" opacity="0.9" filter="url(#softGlow)"/>
  </g>

  <!-- ==========================================
       PAINEL DIREITO: SENSOR ESPECTRAL CCD (CCD-RX)
       ========================================== -->
  <g transform="translate(440, 62)">
    <!-- Chassis do Receptor -->
    <rect x="0" y="0" width="138" height="152" rx="10" fill="#081B33" stroke="rgba(0,229,160,0.4)" stroke-width="1.5"/>
    <rect x="8" y="8" width="122" height="136" rx="6" fill="#040e1e" opacity="0.85"/>

    <!-- Cabeçalho do HUD -->
    <rect x="14" y="16" width="110" height="20" rx="4" fill="rgba(0,229,160,0.15)"/>
    <circle cx="24" cy="26" r="3.5" fill="#00E5A0" filter="url(#softGlow)"/>
    <text x="68" y="29" fill="#00E5A0" font-family="'Orbitron', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="1">CCD-TELEMETRY</text>

    <!-- Mini Gráfico de Leitura Espectral em Barras -->
    <g transform="translate(16, 48)">
      <line x1="0" y1="46" x2="106" y2="46" stroke="rgba(0,180,255,0.3)" stroke-width="0.8"/>
      <!-- Barras de Espectro -->
      <rect x="4" y="28" width="8" height="18" rx="2" fill="#00B4FF" opacity="0.75"/>
      <rect x="18" y="18" width="8" height="28" rx="2" fill="#00F0FF" opacity="0.85"/>
      <rect x="32" y="8" width="8" height="38" rx="2" fill="#00E5A0" filter="url(#softGlow)"/>
      <rect x="46" y="2" width="8" height="44" rx="2" fill="#30D5FF" filter="url(#softGlow)"/>
      <rect x="60" y="12" width="8" height="34" rx="2" fill="#00F0FF" opacity="0.9"/>
      <rect x="74" y="24" width="8" height="22" rx="2" fill="#00E5A0" opacity="0.8"/>
      <rect x="88" y="32" width="8" height="14" rx="2" fill="#00B4FF" opacity="0.7"/>
    </g>

    <!-- Métricas Numéricas de Confirmação -->
    <g transform="translate(14, 108)">
      <rect x="0" y="0" width="110" height="26" rx="4" fill="rgba(0,229,160,0.12)" stroke="rgba(0,229,160,0.35)" stroke-width="0.8"/>
      <text x="10" y="16" fill="#6B7B8D" font-family="'Orbitron', sans-serif" font-size="7">PRECISION</text>
      <text x="102" y="17" fill="#00E5A0" font-family="'Orbitron', sans-serif" font-size="10" font-weight="800" text-anchor="end">99.8%</text>
    </g>

    <!-- Feixes Captados Emergindo da Casca -->
    <path d="M -60 120 L 0 58" stroke="#00B4FF" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.8"/>
    <path d="M -60 155 L 0 88" stroke="#00E5A0" stroke-width="2.4" opacity="0.9" filter="url(#superGlow)"/>
    <path d="M -60 190 L 0 118" stroke="#00F0FF" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.8"/>
  </g>
</svg>
