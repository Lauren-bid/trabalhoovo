<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B4FF"/>
      <stop offset="100%" stop-color="#00E5A0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Egg with sensor array -->
  <ellipse cx="200" cy="150" rx="60" ry="80" fill="#081B33"/>
  <!-- Sensor nodes -->
  <circle cx="170" cy="130" r="8" fill="url(#grad)" filter="url(#glow)"/>
  <circle cx="230" cy="130" r="8" fill="url(#grad)" filter="url(#glow)"/>
  <circle cx="200" cy="180" r="8" fill="url(#grad)" filter="url(#glow)"/>
  <!-- Light beams -->
  <line x1="170" y1="130" x2="140" y2="100" stroke="url(#grad)" stroke-width="3"/>
  <line x1="230" y1="130" x2="260" y2="100" stroke="url(#grad)" stroke-width="3"/>
  <line x1="200" y1="180" x2="200" y2="220" stroke="url(#grad)" stroke-width="3"/>
  <!-- Data stream -->
  <path d="M140 100 q30 20 0 40 q-30 20 0 40" stroke="#00E5A0" stroke-width="2" fill="none" opacity="0.6"/>
</svg>
