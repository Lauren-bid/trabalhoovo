<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4FF"/>
      <stop offset="100%" stop-color="#00E5A0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Stylized egg in tray -->
  <rect x="50" y="200" width="300" height="30" fill="#081B33"/> <!-- tray base -->
  <ellipse cx="200" cy="180" rx="50" ry="70" fill="url(#grad)" filter="url(#glow)"/>
  <!-- Heat waves -->
  <path d="M180 120 q20 -30 40 0" stroke="#00E5A0" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M190 110 q20 -30 40 0" stroke="#00E5A0" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
