<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="liveWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4FF"/>
      <stop offset="35%" stop-color="#00F0FF"/>
      <stop offset="70%" stop-color="#00E5A0"/>
      <stop offset="100%" stop-color="#30D5FF"/>
    </linearGradient>
    <linearGradient id="liveWaveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00B4FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020D1C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="liveBackglow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#00B4FF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020D1C" stop-opacity="0"/>
    </radialGradient>
    <filter id="liveNeon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="420" height="250" fill="url(#liveBackglow)"/>

  <!-- ==========================================
       PAINEL OSCILOSCÓPIO HUD WIDESCREEN
       ========================================== -->
  <g transform="translate(24, 20)">
    <!-- Moldura de Chassis Tecnológico -->
    <rect x="0" y="0" width="372" height="162" rx="10" fill="#081B33" stroke="rgba(0,180,255,0.4)" stroke-width="1.5"/>
    <rect x="8" y="8" width="356" height="146" rx="6" fill="#040e1e" opacity="0.9"/>

    <!-- Grade Milimétrica de Telemetria Óptica -->
    <g opacity="0.16" stroke="#00B4FF" stroke-width="0.8">
      <!-- Linhas Horizontais -->
      <line x1="16" y1="36" x2="356" y2="36"/>
      <line x1="16" y1="64" x2="356" y2="64"/>
      <line x1="16" y1="92" x2="356" y2="92"/>
      <line x1="16" y1="120" x2="356" y2="120"/>

      <!-- Linhas Verticais -->
      <line x1="56" y1="16" x2="56" y2="146"/>
      <line x1="116" y1="16" x2="116" y2="146"/>
      <line x1="176" y1="16" x2="176" y2="146"/>
      <line x1="236" y1="16" x2="236" y2="146"/>
      <line x1="296" y1="16" x2="296" y2="146"/>
    </g>

    <!-- Radar / Sensor Polar de Bio-Ressonância à Esquerda -->
    <g transform="translate(48, 78)">
      <circle cx="0" cy="0" r="28" fill="rgba(0,180,255,0.06)" stroke="#00B4FF" stroke-width="1" opacity="0.6"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#00E5A0" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.8"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#00F0FF" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" filter="url(#liveNeon)"/>
      <!-- Feixe Radial de Varredura -->
      <line x1="0" y1="0" x2="20" y2="-18" stroke="#00F0FF" stroke-width="1.8" filter="url(#liveNeon)"/>
      <!-- Ponto Detectado -->
      <circle cx="12" cy="10" r="3" fill="#00E5A0" filter="url(#liveNeon)"/>
    </g>

    <!-- ÁREA PREENCHIDA SOB A ONDA NEURAL -->
    <path d="M 96 92 Q 130 92 145 90 T 168 85 T 188 40 T 208 132 T 228 32 T 248 108 T 268 76 T 290 92 T 320 92 T 350 92 L 350 146 L 96 146 Z" 
          fill="url(#liveWaveFill)"/>

    <!-- FORMA DE ONDA MULTICANAL BIO-ÓPTICA (SINAL PRINCIPAL) -->
    <path d="M 96 92 Q 130 92 145 90 T 168 85 T 188 40 T 208 132 T 228 32 T 248 108 T 268 76 T 290 92 T 320 92 T 350 92" 
          fill="none" stroke="url(#liveWaveGrad)" stroke-width="3" stroke-linecap="round" filter="url(#liveNeon)"/>
    
    <!-- Linha de Centro e Pulso Secundário -->
    <path d="M 96 92 Q 130 92 150 91 T 172 82 T 188 62 T 208 112 T 228 56 T 248 94 T 268 85 T 350 92" 
          fill="none" stroke="#00E5A0" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.75"/>

    <!-- Picos de Detecção Marcados (High Fidelity) -->
    <g filter="url(#liveNeon)">
      <circle cx="188" cy="40" r="5" fill="#FFFFFF"/>
      <circle cx="228" cy="32" r="5" fill="#00E5A0"/>
    </g>

    <text x="188" y="24" fill="#30D5FF" font-family="'Orbitron', sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">PEAK 1</text>
    <text x="228" y="18" fill="#00E5A0" font-family="'Orbitron', sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">PEAK 2 (99.8%)</text>
  </g>

  <!-- ==========================================
       BADGES E TELEMETRIA INFERIOR
       ========================================== -->
  <g transform="translate(32, 194)">
    <rect x="0" y="0" width="165" height="28" rx="14" fill="#081B33" stroke="rgba(0,180,255,0.4)" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4" fill="#00F0FF" filter="url(#liveNeon)"/>
    <text x="92" y="18" fill="#30D5FF" font-family="'Orbitron', sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">LATENCY &lt; 1.8ms</text>
  </g>

  <g transform="translate(222, 194)">
    <rect x="0" y="0" width="165" height="28" rx="14" fill="#081B33" stroke="rgba(0,229,160,0.4)" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4" fill="#00E5A0" filter="url(#liveNeon)"/>
    <text x="92" y="18" fill="#00E5A0" font-family="'Orbitron', sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">ERP REAL-TIME SYNC</text>
  </g>
</svg>
